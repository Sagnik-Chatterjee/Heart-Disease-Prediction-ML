<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Heart Disease Prediction</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Heart Disease Prediction</h1>

        <p>Enter the patient's information</p>

        <form id="predictionForm">

            <div class="form-group">
                <label for="age">Age</label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    required
                >
            </div>


            <div class="form-group">

                <label for="sex">Sex</label>

                <select id="sex" required>

                    <option value="">
                        Select Sex
                    </option>

                    <option value="M">
                        Male
                    </option>

                    <option value="F">
                        Female
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="chestPain">
                    Chest Pain Type
                </label>

                <select id="chestPain" required>

                    <option value="">
                        Select Chest Pain Type
                    </option>

                    <option value="ATA">
                        ATA
                    </option>

                    <option value="NAP">
                        NAP
                    </option>

                    <option value="TA">
                        TA
                    </option>

                    <option value="ASY">
                        ASY
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="restingBP">
                    Resting Blood Pressure
                </label>

                <input
                    type="number"
                    id="restingBP"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="cholesterol">
                    Cholesterol
                </label>

                <input
                    type="number"
                    id="cholesterol"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="fastingBS">
                    Fasting Blood Sugar
                </label>

                <select id="fastingBS" required>

                    <option value="">
                        Select
                    </option>

                    <option value="0">
                        Normal
                    </option>

                    <option value="1">
                        High
                    </option>

                </select>

            </div>

            <div class="form-group">

                <label for="restingECG">
                    Resting ECG
                </label>

                <select id="restingECG" required>

                    <option value="">
                        Select ECG
                    </option>

                    <option value="Normal">
                        Normal
                    </option>

                    <option value="ST">
                        ST
                    </option>

                    <option value="LVH">
                        LVH
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="maxHR">
                    Maximum Heart Rate
                </label>

                <input
                    type="number"
                    id="maxHR"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label for="exerciseAngina">
                    Exercise Angina
                </label>

                <select id="exerciseAngina" required>

                    <option value="">
                        Select
                    </option>

                    <option value="Y">
                        Yes
                    </option>

                    <option value="N">
                        No
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="oldpeak">
                    Oldpeak
                </label>

                <input
                    type="number"
                    id="oldpeak"
                    step="0.1"
                    required
                >

            </div>


            <div class="form-group">

                <label for="stSlope">
                    ST Slope
                </label>

                <select id="stSlope" required>

                    <option value="">
                        Select ST Slope
                    </option>

                    <option value="Flat">
                        Flat
                    </option>

                    <option value="Up">
                        Up
                    </option>

                    <option value="Down">
                        Down
                    </option>

                </select>

            </div>


            <button type="submit">
                Predict
            </button>

        </form>


        <div id="result"></div>

    </div>


    <script src="script.js"></script>

</body>

</html>
